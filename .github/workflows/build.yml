name: Build Windows MVP
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/GameChatOverlay/GameChatOverlay.csproj -c Release --nologo
      - run: dotnet publish src/GameChatOverlay/GameChatOverlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/win-x64
      - name: Build Windows installer
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            ./scripts/build-installer.ps1 -Version ($env:GITHUB_REF_NAME -replace '^v', '')
          } else {
            ./scripts/build-installer.ps1
          }
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Agripa-windows-x64
          path: |
            artifacts/win-x64/
            artifacts/installer/Agripa-Setup-win-x64.exe
      # UI E2E requires an unlocked interactive Windows session, see tests/Overlay.E2E.ps1.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Agripa-windows-x64
          path: release
      - name: Package portable build
        working-directory: release/win-x64
        run: zip -r ../Agripa-win-x64.zip .
      - name: Generate checksums
        working-directory: release
        run: |
          mv installer/Agripa-Setup-win-x64.exe .
          sha256sum Agripa-Setup-win-x64.exe Agripa-win-x64.zip > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Agripa $RELEASE_TAG" --notes "Agripa desktop builds. Unsigned binaries; Windows requires Microsoft Edge WebView2 Runtime." || gh release view "$RELEASE_TAG" >/dev/null
          fi
          gh release upload "$RELEASE_TAG" \
            release/Agripa-Setup-win-x64.exe \
            release/Agripa-win-x64.zip \
            release/SHA256SUMS
