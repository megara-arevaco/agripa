name: Build Linux
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/linux/package-lock.json
      - name: Validate stable release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const tag=process.env.RELEASE_TAG; if(!/^v\d+\.\d+\.\d+$/.test(tag) || tag!=="v"+require("./package.json").version) throw new Error("Tag must match package.json stable version")'
      - run: npm ci
      - run: npm test
      - name: Desktop smoke test
        run: xvfb-run --auto-servernum npm run smoke -- --no-sandbox
      - run: npm run dist
      - name: Generate checksums
        working-directory: artifacts/linux
        run: sha256sum *.AppImage *.deb > SHA256SUMS-linux
      - uses: actions/upload-artifact@v4
        with:
          name: Agripa-linux-x64
          path: |
            artifacts/linux/*.AppImage
            artifacts/linux/*.deb
            artifacts/linux/SHA256SUMS-linux
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Agripa-linux-x64
          path: release
      - name: Publish Linux assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Agripa $RELEASE_TAG" --notes "Agripa desktop builds. Unsigned binaries." || gh release view "$RELEASE_TAG" >/dev/null
          fi
          gh release upload "$RELEASE_TAG" release/*.AppImage release/*.deb release/SHA256SUMS-linux
